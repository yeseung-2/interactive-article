<style>:root{color-scheme:dark;--bg:#090d14;--ink:#f2eee8;--muted:#9c9eab;--accent:#c9b49d;--line:#ffffff1c;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:5px}button:disabled{opacity:.3;cursor:default}.stage{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 20%,#1a2230,var(--bg) 72%);overflow:auto}.topbar{height:74px;flex-shrink:0;max-width:1440px;width:100%;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line);gap:20px}.topbar h1{font-size:17px;font-weight:500;letter-spacing:.09em;margin:0;display:flex;gap:22px;align-items:center}.topbar h1 span{font-size:10px;letter-spacing:.22em;color:var(--muted)}.chapter{display:flex;align-items:center;gap:14px;color:#c8c9cf;font-size:13px}.chapter>span:first-child{color:var(--accent);font-size:12px;letter-spacing:.1em}.topbar button{border:0;background:transparent;font-size:13px;color:var(--muted);padding:12px}.scene{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:22px 5vw 28px;overflow:hidden}.picture{position:relative;aspect-ratio:1672/941;height:100%;max-height:100%;max-width:100%;width:auto;box-shadow:0 18px 70px #0009;overflow:hidden;background:#111925}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .7s,filter .8s,transform 1.1s;filter:brightness(.96);transform:scale(1)}.art.active{opacity:1}.tense .art{filter:brightness(.76) saturate(.7)}.detail .art.active{transform:scale(1.025)}.intro .art{filter:brightness(.45)}.scene-caption{position:absolute;bottom:8px;left:5vw;right:5vw;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.2em;color:#767e8d;pointer-events:none}.dialogue{width:min(1180px,90vw);margin:0 auto 22px;flex-shrink:0;min-height:204px;background:linear-gradient(110deg,#242332ee,#151a27ee);border-top:1px solid #c9b49d70;border-bottom:1px solid #ffffff10;padding:23px 34px 16px;box-shadow:0 12px 50px #0003}.speaker{display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:.05em;color:var(--accent)}.speaker-line{height:1px;width:22px;background:var(--accent)}#mood{color:#8e92a1;font-size:12px;margin-left:auto;letter-spacing:0}#line{font-size:clamp(18px,1.7vw,24px);font-weight:400;line-height:1.85;word-break:keep-all;overflow-wrap:anywhere;margin:14px 0 16px;min-height:3.7em;white-space:pre-line;letter-spacing:-.025em}#line.changed{animation:reveal .32s ease-out}.dialogue-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.controls{display:flex;align-items:center;gap:15px;flex-shrink:0}.controls button{background:transparent;border:0;padding:7px 5px;font-size:14px}.controls button:hover{color:var(--accent)}#counter{font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.06em}.progress{position:fixed;bottom:0;left:0;width:100%;height:3px;background:#1d2330}#progressFill{height:100%;background:var(--accent);width:0;transition:width .3s}.notice{position:absolute;left:24%;top:46%;width:52%;padding:clamp(12px,2.8vw,36px);background:#f5f2eb;color:#262c32;border-left:4px solid #8c9b78;box-shadow:0 10px 70px #0007;animation:reveal .5s}.notice small{font-size:clamp(10px,1.2vw,14px);color:#6e745f}.notice p{font-size:clamp(16px,2.4vw,30px);line-height:1.5;font-weight:600;margin:12px 0 0}.chat{position:absolute;right:5%;bottom:7%;width:38%;max-width:335px;background:#f3f1ee;color:#252a33;box-shadow:0 12px 80px #0009;border:1px solid #596370;animation:chatIn .5s}.chat-head{display:flex;align-items:center;justify-content:space-between;background:#323b48;color:white;padding:10px 15px;font-size:clamp(11px,1.1vw,14px)}.chat-head button{background:none;border:0;font-size:23px;line-height:1;padding:0 3px}.chat p{font-size:clamp(14px,2vw,23px);line-height:1.7;padding:8px 20px;margin:8px 0}.chat>span{display:block;font-size:10px;color:#7d8490;padding:0 20px 14px}.scroll-track{position:relative;pointer-events:none;z-index:-1}.beat{height:max(380px,65vh)}.accessible-text{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.fallback{position:fixed;inset:30%;z-index:10;background:#111;padding:30px}body.end .art{filter:brightness(.5) saturate(.6)}@keyframes reveal{from{opacity:.2;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes chatIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@media(min-aspect-ratio:2/1){.topbar{height:54px}.dialogue{min-height:180px;padding:15px 30px;margin-bottom:14px}#line{font-size:19px;margin:8px 0}.scene{padding-top:14px}}@media(max-width:650px){.topbar{height:65px;padding:0 6vw}.topbar h1{font-size:15px}.topbar h1 span{display:none}.chapter{font-size:11px;gap:7px}.topbar button{font-size:12px;padding:8px 0}.scene{padding:16px 0 25px;min-height:220px}.picture{width:100%;height:auto;max-height:100%;box-shadow:none}.scene-caption{left:6vw;right:6vw}.dialogue{width:92vw;margin-bottom:25px;padding:22px 22px 14px;min-height:260px}#line{font-size:19px;line-height:1.85;min-height:5.55em;margin-top:18px}.dialogue-footer{align-items:flex-end;gap:14px}#hint{max-width:145px;font-size:11px;line-height:1.7}.controls{gap:10px}.controls button{font-size:13px}#mood{font-size:11px}.notice{top:32%;padding:13px}.notice p{margin-top:6px}.chat{right:3%;bottom:3%;width:44%}.chat p{padding:4px 12px;margin:3px 0}.chat-head{padding:6px 10px}.chat>span{padding:0 12px 8px;font-size:9px}}@media(max-height:550px){.stage{overflow:auto}.scene{flex:none;height:52vh;min-height:180px}.dialogue{min-height:170px}#line{min-height:0;font-size:17px}.topbar{height:48px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* Visual-novel composition: art and dialogue share one stage. */
.stage{display:block;overflow:hidden}
.topbar{height:64px;max-width:none;padding:0 5vw;border-bottom:0}
.scene{position:absolute;inset:64px 4vw 20px;padding:0;display:block;overflow:hidden}
.picture{width:100%;height:100%;max-width:none;max-height:none;aspect-ratio:auto;box-shadow:none}
.art{object-fit:cover;object-position:center}
.dialogue{position:absolute;left:4vw;right:4vw;bottom:20px;width:auto;margin:0;min-height:190px;padding:22px 34px 13px;background:linear-gradient(110deg,rgba(48,35,58,.76),rgba(29,28,44,.72));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-top:1px solid rgba(224,206,233,.34);border-bottom:0;box-shadow:none}
#line{color:#fff}
#line.changed{animation:reveal .32s ease-out}
.dialogue #line{margin:12px 0;min-height:3.7em;text-shadow:0 1px 3px #0007}
.speaker{color:#ece1e9}.speaker-line{background:#d9c7d5}
.dialogue-footer{color:#d0c5d5}
@media(max-width:650px){.topbar{height:52px;padding:0 5vw}.scene{inset:52px 0 12px;min-height:0}.picture{width:100%;height:100%;max-height:none}.art{object-fit:contain;background:#111720}.dialogue{left:0;right:0;bottom:12px;min-height:210px;padding:20px 23px 12px;background:rgba(39,29,49,.76)}.dialogue #line{font-size:18px;min-height:5.55em;line-height:1.75}.scene .picture{display:block}}
@media(max-height:550px){.topbar{height:40px}.scene{inset:40px 4vw 8px;height:auto;min-height:0}.dialogue{bottom:8px;min-height:135px;padding:12px 24px 8px}.dialogue #line{font-size:16px;line-height:1.6;min-height:0;margin:8px 0}.speaker{font-size:12px}.controls button{padding:3px}}

</style>
<style id="story-surroundings">html,body,.stage,.topbar{background:var(--scene-bg,#f5e4c5)!important}.topbar{color:var(--scene-ink,#382c22)}.art{background:var(--scene-bg,#f5e4c5)!important}</style><style>html{-webkit-text-size-adjust:100%;overscroll-behavior:none} @media(pointer:coarse){button{min-height:44px;touch-action:manipulation}} @media(max-height:480px){.dialogue{padding:8px 14px!important;min-height:0!important}.dialogue #line{font-size:14px!important;line-height:1.45!important;margin:5px 0!important}.topbar{height:36px!important}.scene{top:36px!important}}</style></head>
<body>
<main aria-label="가벼운 한 끼, 스크롤로 읽는 이야기" id="reader">
<div class="stage">
<header class="topbar" style="justify-content:flex-end"><button hidden="" id="restart" style="display:none" title="처음으로 돌아가기">처음부터</button></header>
<div class="scene" id="scene">
<div class="picture" id="picture">
<img alt="다이어트 도시락을 검색하는 지민의 컴퓨터 화면" class="art active" data-scene="search" decoding="async" src="../assets/media/d36a90c05037571c.png"/>
<img alt="다양한 다이어트 식품을 판매하는 완존머슬몰 쇼핑몰" aria-hidden="true" class="art" data-scene="shop" decoding="async" src="../assets/media/830eece8234b66a0.png"/>
<img alt="평범한 후기 사이에 수상한 게시물이 섞인 리뷰 목록" aria-hidden="true" class="art" data-scene="reviews" decoding="async" src="../assets/media/d07de9aa7ed1990e.png"/>
<img alt="본문과 연락처가 가려진 수상한 판매 게시글" aria-hidden="true" class="art" data-scene="post" decoding="async" src="../assets/media/374736df23261d98.png"/>
</div>
</div>
<section aria-label="이야기 대사" class="dialogue">
<p id="line">다이어트를 시작한 지 사흘째,<br/>지민은 닭가슴살에 질려버렸다.</p>
<footer class="dialogue-footer" style="justify-content:flex-end"><div class="controls"><button aria-label="이전 문장" id="prev">이전</button><span id="counter">01 / 18</span><button aria-label="다음 문장" id="next">다음</button></div></footer>
</section>
<div aria-label="이야기 진행" aria-valuemax="100" aria-valuemin="0" aria-valuenow="0" class="progress" role="progressbar"><div id="progressFill"></div></div>
</div>
<div class="scroll-track" id="scrollTrack"></div>
</main>
<noscript><div class="fallback">이 이야기는 JavaScript를 켠 브라우저에서 감상할 수 있습니다.</div></noscript>
<script>const beats = [["search","이야기","다이어트를 시작한 지 사흘째,\n지민은 닭가슴살에 질려버렸다.","어느 평범한 밤","intro"],["search","이야기","컴퓨터 앞에서 검색 결과를 넘기던 중,\n처음 보는 쇼핑몰이 눈에 들어왔다.","검색"],["shop","이야기","사이트는 의외로 멀쩡했다.\n저당 도시락부터 단백질 빵, 곤약 볶음밥까지 종류도 다양했다.","완존머슬몰"],["shop","이야기","결제하기 전, 실제 구매자들의 후기를 확인하려고\n상단의 ‘리뷰’ 메뉴를 눌렀다.","리뷰 열기"],["reviews","구매 후기","“배송 빨라요.”  “양은 적지만 맛있어요.”\n“재구매했습니다.”","익숙한 문장들"],["reviews","게시글 제목","“해외 단기 고액 알바. 경력 무관.”\n“마약 판매 문의.”","멈춘 손가락","tense"],["post","이야기","지민은 ‘마약 판매 문의’라는 제목을 눌렀다.\n열린 게시글은 음식 후기와는 아무 상관이 없었다.","게시글 상세","tense"],["post","지민 · 속마음","여기… 도시락 파는 곳 아니었어?","이상한 쇼핑몰","tense detail"]];
const $ = id => document.getElementById(id);
const images = [...document.querySelectorAll('.art')];
const track=$('scrollTrack');
beats.forEach((b,i)=>{const section=document.createElement('section');section.className='beat';section.id=`beat-${i+1}`;const p=document.createElement('p');p.className='accessible-text';p.textContent=`${b[1]}: ${b[2]}`;section.append(p);track.append(section)});
let current=-1,step=0,queued=false;

function measure(){step=track.firstElementChild.getBoundingClientRect().height;track.style.paddingBottom=`${Math.max(0,innerHeight-step)}px`;update()}
function render(index){
 if(index===current)return;
 current=index;
 const [image,speaker,line,,style='']=beats[index];
 document.body.className=style;
 images.forEach(el=>{const active=el.dataset.scene===image;el.classList.toggle('active',active);el.setAttribute('aria-hidden',String(!active))});
 $('line').textContent=line;
 $('line').classList.remove('changed');void $('line').offsetWidth;$('line').classList.add('changed');
 $('counter').textContent=`${String(index+1).padStart(2,'0')} / ${beats.length}`;
 $('prev').disabled=index===0;$('next').textContent=index===beats.length-1?'다시 읽기':'다음';$('next').setAttribute('aria-label',index===beats.length-1?'처음부터 다시 읽기':'다음 문장');
 const progress=Math.round(index/(beats.length-1)*100);$('progressFill').style.width=`${progress}%`;document.querySelector('.progress').setAttribute('aria-valuenow',progress);
}
function updateSurroundings(){let t=Math.max(0,Math.min(1,(scrollY/Math.max(1,step)-3.8)/1.02));t=t*t*(3-2*t);const mix=(a,b)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',');document.documentElement.style.setProperty('--scene-bg','rgb('+mix([245,228,197],[9,13,20])+')');document.documentElement.style.setProperty('--scene-ink','rgb('+mix([56,44,34],[242,238,232])+')');parent.postMessage({type:'intro-tone',tone:t},'*')}
function update(){updateSurroundings();render(Math.min(beats.length-1,Math.max(0,Math.floor((scrollY+step*.18)/step))))}
function go(index){window.scrollTo({top:Math.max(0,Math.min(beats.length-1,index))*step,behavior:'instant'})}
window.addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(()=>{update();queued=false})}},{passive:true});
window.addEventListener('resize',measure);if(window.visualViewport)visualViewport.addEventListener('resize',measure,{passive:true});
document.addEventListener('keydown',e=>{if(e.target.closest('button,a,input,textarea,select'))return;if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(beats.length-1)}});
 $('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current===beats.length-1?0:current+1);$('restart').onclick=()=>go(0);
measure();
</script><script>addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='story-progress')return;window.scrollTo(0,e.data.progress*Math.max(0,document.documentElement.scrollHeight-innerHeight))});addEventListener('wheel',e=>{if(parent!==window){e.preventDefault();parent.postMessage({type:'story-wheel',delta:e.deltaY},'*')}},{passive:false});let touchY=null,touchX=null;addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('button,a,input,select,textarea,.lightbox:not([hidden])')){touchY=null;return}touchY=e.touches[0].clientY;touchX=e.touches[0].clientX},{passive:true});addEventListener('touchmove',e=>{if(parent===window||touchY===null||e.touches.length!==1)return;const y=e.touches[0].clientY,x=e.touches[0].clientX,dy=touchY-y;if(Math.abs(dy)<Math.abs(x-touchX))return;if(e.cancelable)e.preventDefault();parent.postMessage({type:'story-wheel',delta:dy},'*');touchY=y;touchX=x},{passive:false});['touchend','touchcancel'].forEach(type=>addEventListener(type,()=>{touchY=null},{passive:true}));</script></body></html>
